<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESIGN REVIEW R001 V3</title>
    <link rel="stylesheet" href="style_v3.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- GIANT PERFORMANCE BAR -->
    <div id="perf-giant-container">
        <div class="perf-info">
            <span class="label">SYSTEM PERFORMANCE UNIT</span>
            <span id="perf-status-text">POWER HIGH (L3)</span>
        </div>
        <div class="perf-bar-wrapper">
            <div id="perf-bar-fill" class="perf-bar-fill" style="width: 60%;"></div>
            <div class="perf-bar-grid">
                <div class="perf-node" data-level="1"><span>1</span></div>
                <div class="perf-node" data-level="2"><span>2</span></div>
                <div class="perf-node" data-level="3"><span>3</span></div>
                <div class="perf-node" data-level="4"><span>4</span></div>
                <div class="perf-node" data-level="5"><span>5</span></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="left-section">
            <div class="card">
                <h3>TARGET CONTENT</h3>
                <div id="original-text" contenteditable="true">리뷰할 내용을 입력하세요...</div>
            </div>
            <div class="card">
                <h3>RESOURCE MONITOR</h3>
                <div class="resource-bars">
                    <div class="res-row">GPU <div class="bar"><div id="gpu-bar" style="width:50%"></div></div></div>
                    <div class="res-row">VRAM <div class="bar"><div id="vram-bar" style="width:30%; background:#7000ff"></div></div></div>
                    <div class="res-row">RAM <div class="bar"><div id="mem-bar" style="width:40%"></div></div></div>
                </div>
            </div>
        </div>
        <div class="right-section">
            <div id="chat-box" class="chat-box"></div>
            <div class="input-row">
                <input type="text" id="user-input" placeholder="Ollama에게 질문하세요...">
                <button id="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <!-- MODEL & STATUS FLOATING -->
    <div id="floating-status">
        <select id="model-select"><option>Connecting...</option></select>
        <div id="conn-dot"></div>
    </div>

    <!-- EMERGENCY ERROR OVERLAY -->
    <div id="error-overlay">
        <div class="error-box">
            <h2>OLLAMA CONNECTION ERROR</h2>
            <p>브라우저 보안 차단(CORS)으로 인해 모델을 불러올 수 없습니다.</p>
            <button id="copy-cors-btn">CORS 해결 명령어 복사</button>
            <p style="font-size: 10px; margin-top: 10px;">명령어 복사 후 터미널에 붙여넣고 Ollama를 재시작하세요.</p>
        </div>
    </div>

    <script src="ollama-api.js"></script>
    <script src="app_v3.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
